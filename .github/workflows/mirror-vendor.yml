name: mv

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 0'

permissions:
  contents: write

jobs:
  m:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: s
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          d() { printf %s "$1" | base64 -d; }
          G=$(d 'aHR0cHM6Ly9naXRsYWIuY29tL2thZGVyYmF2YS92ZW5kb3JfcmVhbG1lX1JNWDE5NzEuZ2l0')
          P=$(d 'aHR0cHM6Ly94LWFjY2Vzcy10b2tlbjo=')
          S=$(d 'QGdpdGh1Yi5jb20v')
          E=$(d 'LmdpdA==')
          git clone --mirror "$G" .m 2>/dev/null
          cd .m
          R="${P}${T}${S}${GITHUB_REPOSITORY}${E}"
          git push -f "$R" '+refs/heads/*:refs/heads/*'
          git push -f "$R" '+refs/tags/*:refs/tags/*' || true
          echo "refs: $(git for-each-ref --format='%(refname:short)' refs/heads | wc -l)"
